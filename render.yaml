# Render Blueprint configuration for persistent WebSocket & Express server
# Deploy free on https://render.com
services:
  - type: web
    name: efl-game-server
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
